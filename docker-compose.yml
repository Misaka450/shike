services:
  shike-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shike-api
    restart: always
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - PORT=8081
      - CPA_URL=http://cli-proxy-api:5201/v1
      - CPA_API_KEY=${CPA_API_KEY}
      - DB_PATH=/opt/shike-ai/data/db/shike.db
      # 允许跨域访问后端的来源白名单（多个用英文逗号分隔）
      - CORS_ORIGINS=${CORS_ORIGINS:-http://127.0.0.1:3002,http://localhost:3002}
      # 当前拓扑是端口直连、前面没有反向代理，因此默认不信任 X-Forwarded-For（防止伪造 IP 绕过登录限流）
      - TRUST_PROXY=${TRUST_PROXY:-false}
    volumes:
      - /opt/shike-ai/data:/opt/shike-ai/data
    networks:
      - default
      - cliproxyapi_default
    # 健康检查：探测含依赖（数据库）的 /healthz 接口
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # 资源上限：防止异常请求（如超大图片）把宿主机内存打满
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  shike-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shike-web
    restart: always
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # 【关键修复 SEC-03】容器内访问后端必须使用 Docker 服务名，不能用 127.0.0.1
      - API_INTERNAL_URL=http://shike-api:8081
    depends_on:
      - shike-api
    networks:
      - default
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
  cliproxyapi_default:
    external: true